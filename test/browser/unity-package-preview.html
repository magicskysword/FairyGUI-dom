<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FairyGUI Unity 包浏览器验收</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        #preview-error {
            display: none;
            box-sizing: border-box;
            margin: 16px;
            padding: 16px;
            max-width: calc(100% - 32px);
            color: #7f1d1d;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            font: 14px/1.5 monospace;
            white-space: pre-wrap;
        }

        body[data-preview-status="failed"] #preview-error {
            display: block;
        }
    </style>
</head>
<body data-preview-status="loading">
    <pre id="preview-error"></pre>
    <script id="preview-result" type="application/json"></script>
    <script src="../../dist/fairygui.js"></script>
    <script>
        function decodeBase64(text) {
            const encoded = text.replace(/\s+/g, "");
            const binary = atob(encoded);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++)
                bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function nextFrame() {
            return new Promise(resolve => requestAnimationFrame(resolve));
        }

        function serializeError(error) {
            return {
                name: error && error.name || "Error",
                code: error && error.code || null,
                message: error && error.message || String(error),
                diagnostics: error && error.diagnostics || []
            };
        }

        function publishResult(result) {
            window.__fairyguiPreview = result;
            document.getElementById("preview-result").textContent =
                JSON.stringify(result);
        }

        async function startPreview() {
            const packageResponse = await fetch(
                "../fixtures/unity-5.2/BundleUsage_fui.bytes.base64"
            );
            if (!packageResponse.ok)
                throw new Error("无法读取 Unity 包测试夹具。");

            const packageBytes = decodeBase64(await packageResponse.text());
            const root = fgui.GRoot.inst;
            const pkg = fgui.UIPackage.loadPackageFromBuffer(packageBytes, {
                source: "FairyGUI-unity/BundleUsage_fui.bytes",
                resourceBaseURL: "../fixtures/unity-5.2/BundleUsage"
            });
            await pkg.waitForResources();

            const view = fgui.UIPackage.createObject(
                "BundleUsage",
                "Main"
            );
            if (!view)
                throw new Error("包中未创建出 BundleUsage/Main 组件。");

            view.setPosition(0, 0);
            root.addChild(view);
            if (document.fonts)
                await document.fonts.ready;
            await nextFrame();
            await nextFrame();

            const bounds = view.element.getBoundingClientRect();
            const sword = pkg.getItemByName("sword");
            const imageElements = Array.from(
                view.element.querySelectorAll("div")
            ).filter(element =>
                getComputedStyle(element).backgroundImage !== "none"
            );
            const result = {
                status: "ready",
                packageId: pkg.id,
                packageName: pkg.name,
                resourceState: pkg.resourceState,
                diagnostics: pkg.getResourceDiagnostics(),
                component: {
                    name: "Main",
                    width: view.width,
                    height: view.height,
                    bounds: {
                        x: bounds.x,
                        y: bounds.y,
                        width: bounds.width,
                        height: bounds.height
                    }
                },
                sword: {
                    width: sword.width,
                    height: sword.height,
                    assetURL: pkg.getItemAssetURL(sword)
                },
                renderedImageCount: imageElements.length
            };
            publishResult(result);
            document.body.dataset.previewStatus = "ready";
            return result;
        }

        window.__fairyguiPreviewPromise = startPreview().catch(error => {
            const result = {
                status: "failed",
                error: serializeError(error)
            };
            publishResult(result);
            document.body.dataset.previewStatus = "failed";
            document.getElementById("preview-error").textContent =
                JSON.stringify(result, null, 2);
            return result;
        });
    </script>
</body>
</html>
